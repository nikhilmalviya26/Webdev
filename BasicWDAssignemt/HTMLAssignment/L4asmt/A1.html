<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
</head>
<body>

    <table border="1">
        <tr>
            <th colspan="2">Student Details</th>
        </tr>
        <tr>
            <td>Name</td>
            <td>Rahul</td>
        </tr>
        <tr>
            <td>Course</td>
            <td>B.Tech</td>
        </tr>
    </table>

    <br>

    <table border="1">
        <tr>
            <th colspan="3">Course Information</th>
        </tr>
        <tr>
            <td>Java</td>
            <td>Python</td>
            <td>HTML</td>
        </tr>
    </table>

    <br>

    <table border="1">
        <tr>
            <th rowspan="2">Student</th>
            <td>Java</td>
        </tr>
        <tr>
            <td>Python</td>
        </tr>
    </table>

    <br>

    <table border="1">
        <tr>
            <th rowspan="3">Student</th>
            <td>Java</td>
        </tr>
        <tr>
            <td>Python</td>
        </tr>
        <tr>
            <td>HTML</td>
        </tr>
    </table>

</body>
</html>
