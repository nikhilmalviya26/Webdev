<hr>

<h2 class="text-center text-primary mb-4">Form Validation</h2>

<div class="mb-3">
    <label class="form-label">Valid Email</label>
    <input type="email" class="form-control is-valid" value="student@gmail.com">
    <div class="valid-feedback">
        Email is valid!
    </div>
</div>

<div class="mb-3">
    <label class="form-label">Invalid Email</label>
    <input type="email" class="form-control is-invalid" value="student123">
    <div class="invalid-feedback">
        Please enter a valid email address.
    </div>
</div>
