
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Modals</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h3 class="text-center text-danger mb-4">Bootstrap Modals, Tooltips & Popovers</h3>

        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#courseModal">
            View Course
        </button>

        <div class="modal fade" id="courseModal">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Web Development Course</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        Learn HTML, CSS, JavaScript and Bootstrap.
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button class="btn btn-success">Start Course</button>
                    </div>

                </div>
            </div>
        </div>

        <button class="btn btn-danger mt-3" data-bs-toggle="modal" data-bs-target="#deleteModal">
            Delete Course
        </button>

        <div class="modal fade" id="deleteModal">
            <div class="modal-dialog">
                <div class="modal-content">

                    <div class="modal-header">
                        <h5 class="modal-title">Delete Course</h5>
                        <button class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        Are you sure you want to delete this course?
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button class="btn btn-danger" data-bs-dismiss="modal">Delete</button>
                    </div>

                </div>
            </div>
        </div>

        <hr>

        <h4 class="text-primary">Bootstrap Tooltips & Popovers</h4>

        <button class="btn btn-primary"
            data-bs-toggle="tooltip"
            data-bs-title="Click here to learn more">
            Help
        </button>

        <button class="btn btn-success"
            data-bs-toggle="popover"
            data-bs-title="Course Info"
            data-bs-content="Learn HTML, CSS and JavaScript with practical examples.">
            Course Info
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        var tooltip = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        tooltip.forEach(function (item) {
            new bootstrap.Tooltip(item);
        });

        var popover = document.querySelectorAll('[data-bs-toggle="popover"]');
        popover.forEach(function (item) {
            new bootstrap.Popover(item);
        });
    </script>

</body>
</html>
