
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h2 class="text-center text-primary mb-4">Student Registration Form</h2>

        <form>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter password">
            </div>

            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="3" placeholder="Enter your message"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Select Course</label>
                <select class="form-select">
                    <option>HTML</option>
                    <option>CSS</option>
                    <option>JavaScript</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>

        </form>

        <hr>

        <h2 class="text-center text-success mb-4">Responsive Bootstrap Form</h2>

        <form>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text" class="form-control is-valid" value="Rahul">
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text" class="form-control" placeholder="Last Name">
                </div>

            </div>

            <div class="mb-3">
                <label class="form-label">Select Skills</label><br>

                <input type="checkbox" class="form-check-input">
                <label class="form-check-label">HTML</label>

                <input type="checkbox" class="form-check-input ms-3">
                <label class="form-check-label">CSS</label>
            </div>

            <div class="mb-3">
                <label class="form-label">Select Level</label><br>

                <input type="radio" name="level" class="form-check-input">
                <label class="form-check-label">Beginner</label>

                <input type="radio" name="level" class="form-check-input ms-3">
                <label class="form-check-label">Advanced</label>
            </div>

            <div class="form-check form-switch mb-3">
                <input type="checkbox" class="form-check-input">
                <label class="form-check-label">Enable Notifications</label>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control is-invalid" value="wrong-email">
                <div class="invalid-feedback">
                    Please enter a valid email address.
                </div>
            </div>

            <button type="submit" class="btn btn-success">Register</button>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
