<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loginpage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>


    <div id="main">


        <div class="box1">

             <h1>Login</h1>
              <input type="email" name="email" id="" placeholder="Enter your email">
              <input type="password" name="password" id="" placeholder="Confirm a password">
              <input type="checkbox" name="" id=""  placeholder="Remember me"> 
              <button>Login now</button>
              <p>Don't have an account <a href="">Signup now</a></p>
            
        </div>


        <div class="box2">

             <h1>Registration</h1>
            <input type="text" name="name" id="" placeholder="Enter your name">
            <input type="email" name="email" id="" placeholder="Enter your email">
            <input type="password" name="password" id="" placeholder="Create a password">
            <input type="password" name="password" id="" placeholder="Confirm a password">
            <input type="checkbox" name="" id="" placeholder="I accept all terms & conditions">

            <button>Register Now</button>
            <p>Already have an account? <a href="">Login now</a></p>

        </div>
    </div>
