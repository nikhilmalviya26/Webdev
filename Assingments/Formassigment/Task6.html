<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Form</title>
</head>
<body>
    <center><h1>Task: 6</h1></center>



    </table>


    <hr>

<table width="80%" align="center" cellpadding="20">

    <tr>
        
        <td width="45%" align="center">
            <img src="./image.png" width="350" height="500" alt="Doctor Image">
        </td>
        
        <td width="55%">
            <form>
                <h2 align="center">Doctor Appointment Form</h2>
                <hr color="red">
                <table cellpadding="7">
                    <tr>
                        <td>Appointment Date</td>
                        <td>
                            <input type="date">
                        </td>
                    </tr>

                    <tr>
                        <td>Appointment Time</td>
                        <td>
                            <input type="time">
                        </td>
                    </tr>

                    <tr>
                        <td>Name</td>
                        <td>
                            <input type="text" placeholder="First Name">
                            <input type="text" placeholder="Last Name">
                        </td>
                    </tr>

                    <tr>
                        <td>Gender</td>
                        <td>
                            <input type="radio" name="gender">
                            Male

                            <input type="radio" name="gender">
                            Female
                        </td>
                    </tr>

                    <tr>
                        <td>Phone</td>
                        <td>
                            <input type="tel">
                        </td>
                    </tr>

                    <tr>
                        <td>Address</td>
                        <td>
                            <input type="text" placeholder="Street">
                            <input type="text" placeholder="City">
                        </td>
                    </tr>

                    <tr>
                        <td>Your Query</td>
                        <td>
                            <textarea rows="4" cols="30"></textarea>
                        </td>
                    </tr>

                    <tr>
                        <td>* Appointment Type</td>
                        <td>
                            <b>Select which appointment type(s) you require</b>
                            <br>

                            <input type="checkbox">
                            General Checkup
                            <br>

                            <input type="checkbox">
                            Heart checkup
                            <br>

                            <input type="checkbox">
                            Eye checkup
                            <br>

                            <input type="checkbox">
                            Hearing Test
                        </td>
                    </tr>

                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="Send">
                        </td>
                    </tr>

                </table>

            </form>

        </td>

    </tr>

</table>


</body>
</html>
