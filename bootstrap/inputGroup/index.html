<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container p-3">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Search for a course"
        />
        <div class="btn btn-primary" title="click to Search">Search</div>
      </div>
    </div>

    <div class="container p-3">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Enter your email"
        />
        <div class="btn btn-primary">Subscribe</div>
      </div>
    </div>

    <div class="container p-3">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Username" />
      </div>
    </div>

    <div class="container p-3">
      <div class="input-group">
        <input type="text" class="form-control" placeholder="invalid-email" />
      </div>
    </div>

    <div class="input-group">
      <span class="input-group-text">
        <input type="email" class="form-control" />
      </span>

      <br /><br />

      <input type="email" class="form-control is-invalid" />
      <span class="fs-6">Please enter a valid email</span>
    </div>

    <!-- Button trigger modal -->
    <button
      type="button"
      class="btn btn-primary"
      data-bs-toggle="modal"
      data-bs-target="#exampleModal"
    >
      check prices
    </button>

    <!-- Modal -->
    <div
      class="modal fade"
      id="exampleModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Raj institute of coding and robotics</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">...</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary">Save changes</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
